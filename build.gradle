subprojects {
    group = 'fr.crownfall'
    version = mod_version

    plugins.withType(JavaPlugin).configureEach {
        java.toolchain.languageVersion = JavaLanguageVersion.of(21)
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 21
        }
    }

    repositories {
        mavenCentral()
    }
}
